name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+\+1.21.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create Paperclip Jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Rename Paperclip Jar
        run: mv Archive-Server/build/libs/archive-paperclip*.jar Archive-Server/build/libs/archive-paper-${{ github.ref_name }}.jar

      - name: Upload Paperclip Jar
        uses: actions/upload-artifact@v4
        with:
          name: paperclip
          path: Archive-Server/build/libs/archive-paper-${{ github.ref_name }}.jar

      - name: Release Paperclip Artifact
        uses: ncipollo/release-action@v1
        with:
          name: The Archive Paper ${{ github.ref_name }}
          artifacts: Archive-Server/build/libs/archive-paper-${{ github.ref_name }}.jar
          makeLatest: true
