name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+\+26.1.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create Paperclip Jar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rename Paperclip Jar
        run: mv archive-server/build/libs/archive-paperclip*.jar archive-server/build/libs/archive-paper-${{ github.ref_name }}.jar

      - name: Read paper build info
        id: paper
        run: |
          paperRef=$(grep '^paperRef=' gradle.properties | cut -d= -f2-)
          mcVersion=$(grep '^mcVersion=' gradle.properties | cut -d= -f2-)
          paperBuild=$(curl -sf --max-time 10 "https://fill.papermc.io/v3/projects/paper/versions/${mcVersion}/builds" \
            | jq -r --arg ref "$paperRef" '.[] | select((.commits // [])[].sha == $ref) | .id' \
            | head -1 || echo "")
          {
            echo "paperRef=$paperRef"
            echo "mcVersion=$mcVersion"
            echo "paperBuild=${paperBuild:-unknown}"
            echo "shortSha=${paperRef:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Release Paperclip Artifact
        uses: ncipollo/release-action@v1
        with:
          name: The Archive Paper ${{ github.ref_name }}
          artifacts: archive-server/build/libs/archive-paper-${{ github.ref_name }}.jar
          makeLatest: true
          body: |
            Built against **Paper ${{ steps.paper.outputs.mcVersion }} build #${{ steps.paper.outputs.paperBuild }}** ([`${{ steps.paper.outputs.shortSha }}`](https://github.com/PaperMC/Paper/commit/${{ steps.paper.outputs.paperRef }}))
