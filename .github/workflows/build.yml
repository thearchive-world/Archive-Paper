name: Build Archive Paper
on:
  push:
    branches:
      - "*"
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        run: echo "PROJECT_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Cache writes only on the dev branch (named after the project version in gradle.properties)
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', env.PROJECT_VERSION) }}

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test Results
          path: |
            **/build/test-results/test/TEST-*.xml

      - name: Create Paperclip Jar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rename Paperclip Jar
        run: mv archive-server/build/libs/archive-paperclip*.jar archive-server/build/libs/archive-paper-${{ env.PROJECT_VERSION }}.jar

      - name: Upload Paperclip Jar
        uses: actions/upload-artifact@v6
        with:
          name: paperclip
          path: archive-server/build/libs/archive-paper-${{ env.PROJECT_VERSION }}.jar

